<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%232867c7%27/%3E%3Ctext x=%276%27 y=%2724%27 fill=%27white%27 font-size=%2723%27%3EM%3C/text%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mousqueau</title>
    <!-- Paint the theme's ground before the bundle loads, so a window never
         flashes white. Keep these in step with --bg in src/style.css. -->
    <style>
      html { background: #f2f4f7; }
      @media (prefers-color-scheme: dark) { html { background: #0f0f0f; } }
      html[data-theme="light"] { background: #f2f4f7; }
      html[data-theme="dark"] { background: #0f0f0f; }
    </style>
    <script>
      // Go passes a theme chosen in Settings; "system" uses the query above.
      var theme = new URLSearchParams(location.search).get("theme");
      if (theme === "dark" || theme === "light")
        document.documentElement.dataset.theme = theme;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
