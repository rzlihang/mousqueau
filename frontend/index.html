<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%232867c7%27/%3E%3Ctext x=%276%27 y=%2724%27 fill=%27white%27 font-size=%2723%27%3EM%3C/text%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mousqueau</title>
    <!-- colors:start (generated by scripts/colors.mjs) -->
    <style>
      html { background: #f2f4f7; color-scheme: light; }
      @media (prefers-color-scheme: dark) { html { background: #0f0f0f; color-scheme: dark; } }
      html[data-theme="light"] { background: #f2f4f7; color-scheme: light; }
      html[data-theme="dark"] { background: #0f0f0f; color-scheme: dark; }
    </style>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var choice = params.get("theme");
        if (choice === null) {
          try { choice = localStorage.getItem("mousqueau-theme"); } catch (_) {}
        }
        var dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <!-- colors:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
