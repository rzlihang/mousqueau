<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%232867c7%27/%3E%3Ctext x=%276%27 y=%2724%27 fill=%27white%27 font-size=%2723%27%3EM%3C/text%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mousqueau</title>
    <!-- Paint the theme's ground before the bundle loads. color-scheme is what
         WebKit uses for the canvas; without it the canvas stays white until
         CSS runs. Keep the colours in step with --bg in src/style.css. -->
    <meta name="color-scheme" content="light dark" />
    <style>
      html { background: #f2f4f7; color-scheme: light; }
      body { margin: 0; background: inherit; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) { background: #0f0f0f; color-scheme: dark; }
      }
      html[data-theme="light"] { background: #f2f4f7; color-scheme: light; }
      html[data-theme="dark"] { background: #0f0f0f; color-scheme: dark; }
    </style>
    <script>
      // Native appearance is available before a new webview's media query.
      var query = new URLSearchParams(location.search);
      var theme = query.get("theme");
      if (theme !== "dark" && theme !== "light")
        theme = query.get("systemTheme");
      if (theme === "dark" || theme === "light") {
        document.documentElement.dataset.theme = theme;
        var scheme = document.querySelector('meta[name="color-scheme"]');
        if (scheme) scheme.setAttribute("content", theme);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
