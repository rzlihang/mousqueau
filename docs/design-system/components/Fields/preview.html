<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<div id="root"></div>
<script>
  var M = window.Mousqueau, A = window.antd, h = React.createElement;
  var speakers = [
    { id: "A", name: "A", color: "#1677ff" },
    { id: "B", name: "B", color: "#52c41a" },
    { id: "C", name: "C", color: "#d46b08" }
  ];
  var cues = [
    { id: "c1", identifier: 1, start: 0.5, end: 3.5, text: "我們今天要討論新的字幕編集器。", speakerIds: ["A"], review: false },
    { id: "c2", identifier: 2, start: 3.5, end: 7, text: "可以先保留原本的字幕，再讓使用者確認修正。", speakerIds: ["B"], review: false },
    { id: "c3", identifier: 3, start: 7, end: 11, text: "對。那說話人的標記呢？", speakerIds: ["A", "C"], review: true },
    { id: "c4", identifier: 4, start: 11, end: 15, text: "如果同一句有兩個人，就應該標記需要檢查。", speakerIds: [], review: false }
  ];
  function mount(el) { ReactDOM.createRoot(document.getElementById("root")).render(h(M.Provider, { style: { padding: 16 } }, el)); }


  mount(h("div", { style: { maxWidth: 420, display: "grid", gap: 10 } },
    h("div", { className: "range", style: { marginTop: 0 } },
      h("label", null, "开始（秒）", h(A.InputNumber, { min: 0, defaultValue: 0 })),
      h("label", null, "结束（秒）", h(A.InputNumber, { min: 0, defaultValue: 60 }))),
    h(A.Input, { placeholder: "https://www.youtube.com/watch?v=…" }),
    h(A.Select, { mode: "multiple", style: { width: "100%" }, placeholder: "Unknown · 未指派说话人", defaultValue: ["A", "C"], options: speakers.map(function (s) { return { value: s.id, label: s.name }; }) }),
    h(A.Space, null, h(A.Checkbox, { defaultChecked: true }, "需要复核"), h(A.Switch, { size: "small" }))));

</script>
</body>
</html>
