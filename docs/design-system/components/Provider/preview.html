<!-- @dsCard group="Foundation" height=580 width=1280 subtitle="The whole window, composed" -->
<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<div id="root"></div>
<script>
  var M = window.Mousqueau, A = window.antd, h = React.createElement;
  var speakers = [
    { id: "A", name: "A", color: "#1677ff" },
    { id: "B", name: "B", color: "#52c41a" },
    { id: "C", name: "C", color: "#d46b08" }
  ];
  var cues = [
    { id: "c1", identifier: 1, start: 0.5, end: 3.5, text: "我們今天要討論新的字幕編集器。", speakerIds: ["A"], review: false },
    { id: "c2", identifier: 2, start: 3.5, end: 7, text: "可以先保留原本的字幕，再讓使用者確認修正。", speakerIds: ["B"], review: false },
    { id: "c3", identifier: 3, start: 7, end: 11, text: "對。那說話人的標記呢？", speakerIds: ["A", "C"], review: true },
    { id: "c4", identifier: 4, start: 11, end: 15, text: "如果同一句有兩個人，就應該標記需要檢查。", speakerIds: [], review: false }
  ];
  function mount(el) { ReactDOM.createRoot(document.getElementById("root")).render(h(M.Provider, { style: { padding: 16 } }, el)); }


  ReactDOM.createRoot(document.getElementById("root")).render(
    h(M.Provider, null,
      h(M.AppHeader, { actions: [
        h(A.Button, { key: 1 }, "导入媒体"), h(A.Button, { key: 2 }, "导入 SRT"), h(A.Button, { key: 3 }, "开启项目"),
        h(A.Button, { key: 4 }, "保存项目 •"), h(A.Button, { key: 5, type: "primary" }, "导出 SRT")] },
        h(M.ThemeToggle, { checked: document.documentElement.getAttribute("data-theme") === "dark" })),
      h(M.StatusBar, null,
        h(A.Tag, { color: "green" }, "FFmpeg 已就绪"), h(A.Tag, null, "OpenAI 未配置 · 可离线编辑"),
        h(A.Button, { size: "small" }, "YouTube 导入"), h(A.Button, { size: "small" }, "载入示例")),
      h("main", { className: "workspace", style: { height: 420, minHeight: 0 } },
        h(M.Panel, { title: "媒体与选取范围", className: "media-panel" },
          h(M.MediaPlaceholder), h("p", { className: "path" }, "文件保留在本机。仅确认分析时上传选定音频。"), h(M.Timecode, { seconds: 0 })),
        h(M.Panel, { title: "字幕", count: "4 句", className: "cues-panel",
          extra: h(A.Space, null, h(A.Button, null, "撤销"), h(A.Button, { disabled: true }, "重做")) },
          h("div", { className: "cue-list" }, cues.map(function (c, i) { return h(M.CueCard, { key: c.id, cue: c, speakers: speakers, selected: i === 0 }); }))),
        h(M.Panel, { title: "说话人管理", className: "review-panel" },
          h("div", { className: "speaker-list" }, speakers.map(function (s) { return h(M.SpeakerTag, { key: s.id, speaker: s }); })),
          h(M.SuggestionCard, { suggestion: { id: "s1", cueIdentifier: 1, original: cues[0].text, proposed: "我們今天要討論新的字幕編輯器。", speakerIds: ["A"], status: "pending", review: false }, speakers: speakers })))));

</script>
</body>
</html>
