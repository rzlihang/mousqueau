name: checks
# The repository is public, so Actions minutes are free and every job runs
# on pull requests, including the macOS and Windows builds.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:
# A new push to a pull request cancels its run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go test -race ./internal/...
      - run: pnpm install --frozen-lockfile && pnpm run typecheck && pnpm test && pnpm run build
        working-directory: frontend
      - run: node --test scripts/frontend-dependencies.test.mjs
      - run: node scripts/notices.mjs && git diff --exit-code -- THIRD_PARTY_NOTICES.txt
      - run: CGO_ENABLED=0 go test -tags server ./...
      - run: CGO_ENABLED=0 go build -tags server -o /tmp/mousqueau-headless .
  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: frontend
      - run: go test ./...
      - run: go build -tags production -o /tmp/mousqueau .
  linux-desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev ffmpeg xvfb openbox xdotool x11-utils imagemagick
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: frontend
      - run: go test ./...
      - run: go build -tags production -o /tmp/mousqueau .
      # WebKitGTK sandboxes its web processes with bubblewrap, which the
      # runner's AppArmor policy forbids from creating user namespaces.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a -s "-screen 0 1700x1050x24" dbus-run-session -- scripts/linux-gui-smoke.sh /tmp/mousqueau linux-gui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-gui-screenshots
          path: linux-gui
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: frontend
      - run: go test ./...
      - run: go build -tags production -ldflags "-H windowsgui" -o mousqueau.exe .
